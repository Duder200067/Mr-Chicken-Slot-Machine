<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Chicken Slot Machine</title>
<style>
:root{
  --gold:#d18b00;
  --gold-dark:#9b6400;
  --cream:#fff7d6;
  --green:#188a39;
  --ink:#302410;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  text-align:center;
  color:var(--ink);
  background:
    radial-gradient(circle at top left, #ffe691 0, transparent 32%),
    linear-gradient(180deg,#fff7d6 0%,#ffe9a3 100%);
}
main{
  width:min(96vw,640px);
  margin:0 auto;
  padding:24px 12px 30px;
}
h1{
  margin:0 0 14px;
  color:var(--gold-dark);
  font-size:clamp(2rem,7vw,3.3rem);
}
.machine{
  position:relative;
  padding:16px;
  border:4px solid var(--gold);
  border-radius:14px;
  background:#fffdf2;
  box-shadow:0 10px 28px rgba(92,58,0,.2);
}
.grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(54px,90px));
  gap:6px;
  justify-content:center;
  margin:4px auto 16px;
  transition:transform .35s ease, filter .35s ease;
}
.mini-slots{
  display:none;
  grid-template-columns:120px 120px;
  grid-template-areas:"lt rt" "lb rb";
  gap:8px;
  position:absolute;
  left:50%;
  top:84px;
  width:min(96vw,900px);
  transform:translateX(-50%);
  justify-content:space-between;
  pointer-events:none;
  z-index:1;
}
.mini-slots.active{
  display:grid;
}
.mini-grid:nth-child(1){grid-area:lt}
.mini-grid:nth-child(2){grid-area:lb}
.mini-grid:nth-child(3){grid-area:rt}
.mini-grid:nth-child(4){grid-area:rb}
.mini-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:3px;
  padding:6px;
  border:2px solid var(--gold);
  border-radius:8px;
  background:#fffaf0;
  pointer-events:auto;
}
.mini-cell{
  aspect-ratio:1;
  border:1px solid #d18b00;
  border-radius:5px;
  background:white;
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.mini-cell.win{
  background:#fff59d;
  box-shadow:0 0 8px gold;
}
.cell{
  aspect-ratio:1;
  border:3px solid var(--gold);
  border-radius:10px;
  background:white;
  font-size:clamp(28px,8vw,42px);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .18s, box-shadow .18s, transform .18s;
}
.win{
  background:#fff59d;
  box-shadow:0 0 14px gold;
  transform:scale(1.04);
}
.grid.jackpot-mode{
  transform:scale(1.08);
  filter:drop-shadow(0 12px 22px rgba(209,139,0,.32));
}
.cell.locked{
  background:#fff2a6;
  box-shadow:0 0 18px rgba(255,191,0,.78);
  animation:lockedPulse .55s ease-in-out infinite alternate;
}
.cell.suspense{
  z-index:2;
  border-color:#ff5b35;
  background:#fff;
  box-shadow:0 0 26px rgba(255,91,53,.95),0 0 48px rgba(255,213,79,.9);
  animation:suspenseShake .16s linear infinite, suspenseGlow .5s ease-in-out infinite alternate;
}
.cell.final-focus{
  z-index:3;
  border-color:#ff2d00;
  box-shadow:0 0 34px rgba(255,45,0,1),0 0 70px rgba(255,213,79,1);
  animation:finalFocusShake .13s linear infinite, suspenseGlow .38s ease-in-out infinite alternate;
}
.cell.jackpot-pop{
  animation:jackpotPop .7s cubic-bezier(.2,1.5,.35,1) both;
}
#info.jackpot-text{
  font-size:clamp(1.15rem,4vw,1.65rem);
  color:#c83d13;
  text-shadow:0 0 14px rgba(255,213,79,.85);
  animation:textPulse .45s ease-in-out infinite alternate;
}
@keyframes lockedPulse{
  from{transform:scale(1);filter:saturate(1)}
  to{transform:scale(1.06);filter:saturate(1.35)}
}
@keyframes suspenseShake{
  0%,100%{transform:scale(1.22) rotate(-2deg)}
  50%{transform:scale(1.31) rotate(2deg)}
}
@keyframes finalFocusShake{
  0%,100%{transform:scale(1.48) rotate(-3deg)}
  50%{transform:scale(1.62) rotate(3deg)}
}
@keyframes suspenseGlow{
  from{filter:saturate(1)}
  to{filter:saturate(1.8)}
}
@keyframes jackpotPop{
  0%{transform:scale(1.35) rotate(-4deg)}
  55%{transform:scale(1.7) rotate(3deg)}
  100%{transform:scale(1.08) rotate(0)}
}
@keyframes textPulse{
  from{transform:scale(1)}
  to{transform:scale(1.05)}
}
button{
  min-height:42px;
  padding:10px 14px;
  margin:5px;
  border:2px solid var(--gold);
  border-radius:8px;
  background:#fff6c7;
  color:#3c2a00;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#ffe88c}
button:disabled{
  opacity:.55;
  cursor:not-allowed;
}
#spinBtn{
  width:min(260px,90%);
  font-size:1.08rem;
  background:#ffd54f;
}
.spin-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}
#spinModeBtn,#audioBtn,#menuBtn{
  min-width:84px;
}
#audioBtn{display:none}
.panel{
  border:1px solid #c7aa55;
  background:white;
  width:min(100%,360px);
  margin:14px auto;
  padding:12px;
  border-radius:10px;
}
.panel-title{
  display:block;
  margin-bottom:6px;
  font-size:1.08rem;
}
#market{
  border-width:2px;
  border-color:var(--gold);
  background:#fffaf0;
  margin-bottom:0;
}
#payoutChoices[hidden]{display:none}
#stats{
  margin-top:8px;
  font-weight:bold;
}
#earned{
  min-height:34px;
  font-size:28px;
  color:var(--green);
  font-weight:bold;
  margin-top:10px;
}
#info{
  min-height:24px;
  font-weight:bold;
  color:var(--gold-dark);
}
#darkCoin{
  position:fixed;
  left:12px;
  bottom:12px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:3px solid #1d160d;
  background:radial-gradient(circle at 35% 30%,#4b3a1d,#111 68%);
  box-shadow:0 0 16px rgba(0,0,0,.55);
  cursor:pointer;
}
#sideMenu{
  position:fixed;
  right:12px;
  top:12px;
  z-index:8;
}
#sickleOffer{
  display:none;
  position:fixed;
  right:12px;
  bottom:12px;
  z-index:9;
  padding:12px;
  border:3px solid var(--gold);
  border-radius:10px;
  background:#fffdf2;
  box-shadow:0 12px 28px rgba(48,36,16,.28);
}
#sickleOffer.active{
  display:block;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:12;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(28,20,10,.52);
}
.modal.active{
  display:flex;
}
.modal-card{
  width:min(94vw,390px);
  padding:18px;
  border:4px solid var(--gold);
  border-radius:12px;
  background:#fffdf2;
  box-shadow:0 18px 40px rgba(48,36,16,.35);
}
.modal-card h2{
  margin:0 0 8px;
  color:var(--gold-dark);
}
.modal-card input{
  width:min(100%,280px);
  padding:10px;
  border:2px solid #c7aa55;
  border-radius:8px;
  font:inherit;
}
.pool-table{
  position:relative;
  height:170px;
  margin:12px 0;
  border:8px solid #6b3d16;
  border-radius:18px;
  background:radial-gradient(circle at center,#22865b,#0f593b 72%);
  box-shadow:inset 0 0 18px rgba(0,0,0,.35);
}
#flipCoin{
  position:absolute;
  left:calc(50% - 36px);
  top:48px;
  width:72px;
  height:72px;
  border-radius:50%;
  border:4px solid #a96e00;
  background:#ffd54f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  box-shadow:0 8px 18px rgba(0,0,0,.35);
}
#flipCoin.flipping{
  animation:coinFlip 2.1s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes coinFlip{
  0%{transform:rotateY(0) translateY(0)}
  18%{transform:rotateY(180deg) translateY(-28px)}
  36%{transform:rotateY(360deg) translateY(-58px)}
  54%{transform:rotateY(540deg) translateY(-88px)}
  70%{transform:rotateY(720deg) translateY(-58px)}
  86%{transform:rotateY(900deg) translateY(-28px)}
  100%{transform:rotateY(1080deg) translateY(0)}
}
@media(max-width:880px){
  .mini-slots{
    position:static;
    transform:none;
    width:100%;
    grid-template-columns:repeat(2,minmax(112px,1fr));
    grid-template-areas:"lt rt" "lb rb";
    margin:8px auto 14px;
  }
}
</style>
</head>
<body>
<main>
  <h1>🐔 Mr. Chicken Slot Machine</h1>
  <section class="machine" aria-label="Slot machine">
    <div class="grid" id="grid"></div>
    <div class="mini-slots" id="miniSlots"></div>
    <div class="spin-row">
      <button id="spinBtn" onclick="spin()">SPIN (1 coin)</button>
      <button id="spinModeBtn" onclick="toggleSpinMode()">5x Toggle</button>
      <button id="audioBtn" onclick="toggleAudio()">Audio On</button>
    </div>

    <div id="stats"></div>
    <div id="earned">💰 Earned: 0</div>
    <div id="info"></div>

    <div id="market" class="panel">
      <span class="panel-title"><b>🏪 Market</b></span>
      <button id="luckBtn" onclick="buyLuck()">🍀 Luck (25)</button>
      <button id="multBtn" onclick="buyMult()">🔥 Multiplier (50)</button>
      <button id="jackpotBtn" onclick="buyJackpot()">🎰 Jackpot Chance (40)</button>
      <button id="sackBtn" onclick="buySack()">💼 Sack of Coins (10)</button>
      <br>
      <button id="payoutToggle" onclick="togglePayouts()" aria-expanded="false">Show Payout Upgrades</button>
      <div id="payoutChoices" hidden></div>
    </div>
  </section>
</main>

<button id="sideMenu" onclick="openMenu()">Menu</button>
<button id="darkCoin" aria-label="Double or nothing" onclick="openDoubleOrNothing()"></button>
<div id="sickleOffer">
  <div><b>🌾 Sickle appeared!</b></div>
  <button onclick="buySickle()">Buy for 80%</button>
</div>

<div id="doubleModal" class="modal" aria-live="polite">
  <div class="modal-card">
    <h2>Double or Nothing</h2>
    <p>Choose heads or tails, then flip. Guess right to double coins. Guess wrong and you lose coins and upgrades.</p>
    <div class="pool-table">
      <div id="flipCoin">🐔</div>
    </div>
    <button onclick="chooseDoubleOrNothing('heads')">Heads 🐔</button>
    <button onclick="chooseDoubleOrNothing('tails')">Tails 🐔🍑</button>
    <button onclick="closeDoubleOrNothing()">Cancel</button>
  </div>
</div>

<div id="codesModal" class="modal" aria-live="polite">
  <div class="modal-card">
    <h2>Codes</h2>
    <input id="codeInput" placeholder="Enter code">
    <br>
    <button onclick="submitCode()">Submit</button>
    <button onclick="closeCodes()">Close</button>
  </div>
</div>

<div id="menuModal" class="modal" aria-live="polite">
  <div class="modal-card">
    <h2>Menu</h2>
    <button onclick="toggleAudio()" id="menuAudioBtn">Audio On</button>
    <button onclick="openCodes()">Codes</button>
    <button onclick="closeMenu()">Close</button>
  </div>
</div>

<script>
let coins=30,shopMult=1,streakMult=1,luck=0,jackpotLevel=0,spinning=false;
let coinSacks=0,spinBatch=1,audioOn=true,sickleRolls=0,infiniteCoins=false,doubleChoice=null,sickleOfferActive=false,sickleOfferTimer=null;
const masterVolume=1.1;
const symbols=["🐔","🐦","🌽","🚜","🌾","💧"];
const symbolPayouts=Object.fromEntries(symbols.map(symbol=>[symbol,0]));
const grid=document.getElementById("grid");
const miniSlots=document.getElementById("miniSlots");

for(let i=0;i<15;i++){
  const d=document.createElement("div");
  d.className="cell";
  d.textContent="❔";
  grid.appendChild(d);
}

const miniBoards=[];
for(let b=0;b<4;b++){
  const board=document.createElement("div");
  board.className="mini-grid";
  const cells=[];
  for(let i=0;i<15;i++){
    const d=document.createElement("div");
    d.className="mini-cell";
    d.textContent="❔";
    board.appendChild(d);
    cells.push(d);
  }
  miniSlots.appendChild(board);
  miniBoards.push(cells);
}

const payoutChoices=document.getElementById("payoutChoices");
symbols.forEach((symbol,index)=>{
  const btn=document.createElement("button");
  btn.id=`payout-${index}`;
  btn.onclick=()=>buyPayout(symbol);
  payoutChoices.appendChild(btn);
});

function beep(freq,dur){
  if(!audioOn) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.frequency.value=freq;
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    g.gain.setValueAtTime(0.08*masterVolume,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
    o.stop(ctx.currentTime+dur);
  }catch(e){}
}

function playTone(ctx,freq,start,dur,type="sine",volume=0.08){
  if(!audioOn) return;
  const o=ctx.createOscillator();
  const g=ctx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,start);
  g.gain.setValueAtTime(0.0001,start);
  g.gain.exponentialRampToValueAtTime(volume*masterVolume,start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  o.connect(g);
  g.connect(ctx.destination);
  o.start(start);
  o.stop(start+dur+0.03);
}

function playJackpotBuild(){
  if(!audioOn) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const now=ctx.currentTime;
    const notes=[220,277,330,415,554,660,831,988];

    for(let i=0;i<22;i++){
      const start=now+i*0.125;
      const freq=notes[i%notes.length]*(i>15?1.5:1);
      playTone(ctx,freq,start,0.09,i%2?"square":"triangle",0.045+i*0.002);
      if(i%4===0) playTone(ctx,110,start,0.06,"sawtooth",0.035);
    }

    const riser=ctx.createOscillator();
    const gain=ctx.createGain();
    riser.type="sawtooth";
    riser.frequency.setValueAtTime(180,now);
    riser.frequency.exponentialRampToValueAtTime(1200,now+2.75);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.055,now+0.2);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+2.78);
    riser.connect(gain);
    gain.connect(ctx.destination);
    riser.start(now);
    riser.stop(now+2.8);
  }catch(e){}
}

function playJackpotDrop(){
  if(!audioOn) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const now=ctx.currentTime;
    playTone(ctx,82,now,0.5,"sawtooth",0.16);
    playTone(ctx,164,now,0.32,"square",0.11);
    playTone(ctx,659,now+0.02,0.18,"triangle",0.12);
    playTone(ctx,988,now+0.12,0.16,"triangle",0.09);
    playTone(ctx,1318,now+0.24,0.22,"triangle",0.08);
    playTone(ctx,55,now+0.28,0.35,"sine",0.14);
  }catch(e){}
}

function scaledCost(base,level,growth){
  return Math.ceil((base*Math.pow(growth,level))/5)*5;
}

function luckCost(){ return scaledCost(25,luck,1.65); }
function multCost(){ return scaledCost(50,shopMult-1,2.25); }
function payoutCost(symbol){ return scaledCost(20,symbolPayouts[symbol],1.85); }
function jackpotCost(){ return scaledCost(40,jackpotLevel,1.8); }
function sackCost(){ return 10; }
function sickleCost(){ return Math.max(1,Math.round(coins*0.8)); }

function randomSymbol(luckySymbol){
  const luckyChance=Math.min(0.35,luck*0.025);
  if(luckySymbol&&Math.random()<luckyChance) return luckySymbol;
  return symbols[Math.floor(Math.random()*symbols.length)];
}

function spend(cost){
  if(infiniteCoins) return true;
  if(coins<cost) return false;
  coins-=cost;
  return true;
}

function checkSacks(){
  if(!infiniteCoins&&coins<=0&&coinSacks>0){
    const rescue=coinSacks*10;
    coins+=rescue;
    coinSacks=0;
    document.getElementById("info").textContent=`Sack of Coins rescued you with ${rescue} coins`;
    document.getElementById("earned").textContent="💰 Earned: "+rescue;
    beep(620,0.18);
    return true;
  }
  return false;
}

function update(){
  const topPayout=Math.max(...Object.values(symbolPayouts));
  const coinText=infiniteCoins?"Infinity":coins;
  document.getElementById("stats").textContent=`Coins: ${coinText} | Mult: x${shopMult} | Streak: x${streakMult} | Luck: ${luck} | Jackpot: ${Math.round((0.015+jackpotLevel*0.005)*100)}% | Sacks: ${coinSacks} | Sickle: ${sickleRolls} | Best Payout: +${topPayout}`;
  document.getElementById("spinBtn").textContent=spinBatch===5?"SPIN 5x (1 coin each)":"SPIN (1 coin)";
  document.getElementById("spinModeBtn").textContent=spinBatch===5?"1x Toggle":"5x Toggle";
  document.getElementById("audioBtn").textContent=audioOn?"Audio On":"Audio Off";
  document.getElementById("menuAudioBtn").textContent=audioOn?"Audio On":"Audio Off";
  miniSlots.classList.toggle("active",spinBatch===5);
  document.getElementById("spinBtn").disabled=spinning||(!infiniteCoins&&coins<spinBatch&&!(coins<=0&&coinSacks>0));
  document.getElementById("luckBtn").textContent=`🍀 Luck (${luckCost()})`;
  document.getElementById("multBtn").textContent=`🔥 Multiplier (${multCost()})`;
  document.getElementById("jackpotBtn").textContent=`🎰 Jackpot Chance (${jackpotCost()})`;
  document.getElementById("sackBtn").textContent=`💼 Sack of Coins (${sackCost()})`;
  document.getElementById("luckBtn").disabled=spinning||(!infiniteCoins&&coins<luckCost());
  document.getElementById("multBtn").disabled=spinning||(!infiniteCoins&&coins<multCost());
  document.getElementById("jackpotBtn").disabled=spinning||(!infiniteCoins&&coins<jackpotCost());
  document.getElementById("sackBtn").disabled=spinning||(!infiniteCoins&&coins<sackCost());
  symbols.forEach(symbol=>{
    const btn=document.getElementById(`payout-${symbols.indexOf(symbol)}`);
    btn.textContent=`${symbol} Payout +${symbolPayouts[symbol]} (${payoutCost(symbol)})`;
    btn.disabled=spinning||(!infiniteCoins&&coins<payoutCost(symbol));
  });
}

function maybeShowSickleOffer(){
  if(sickleOfferActive||spinning||infiniteCoins) return;
  if(Math.random()>=0.03) return;
  sickleOfferActive=true;
  const offer=document.getElementById("sickleOffer");
  offer.classList.add("active");
  clearTimeout(sickleOfferTimer);
  sickleOfferTimer=setTimeout(hideSickleOffer,10000);
}

function hideSickleOffer(){
  sickleOfferActive=false;
  document.getElementById("sickleOffer").classList.remove("active");
  clearTimeout(sickleOfferTimer);
  sickleOfferTimer=null;
}

function clearWin(){
  grid.classList.remove("jackpot-mode");
  document.getElementById("info").classList.remove("jackpot-text");
  document.querySelectorAll(".cell").forEach(c=>c.classList.remove("win","locked","suspense","final-focus","jackpot-pop"));
  document.querySelectorAll(".mini-cell").forEach(c=>c.classList.remove("win"));
}

function evaluateBoard(board,cells){
  let reward=0;
  const won=new Set();

  function add(idxs,val){
    const symbol=board[idxs[0]];
    reward+=(val+symbolPayouts[symbol])*shopMult*streakMult;
    idxs.forEach(i=>won.add(i));
  }

  for(let r=0;r<3;r++){
    const b=r*5;
    if(board[b]===board[b+1]&&board[b]===board[b+2]&&board[b]===board[b+3]&&board[b]===board[b+4]){
      add([b,b+1,b+2,b+3,b+4],10);
    }else{
      if(board[b]===board[b+1]&&board[b]===board[b+2]&&board[b]===board[b+3]) add([b,b+1,b+2,b+3],5);
      if(board[b+1]===board[b+2]&&board[b+1]===board[b+3]&&board[b+1]===board[b+4]) add([b+1,b+2,b+3,b+4],5);

      for(let start=0;start<=2;start++){
        const i=b+start;
        if(board[i]===board[i+1]&&board[i]===board[i+2]) add([i,i+1,i+2],3);
      }
    }
  }

  for(let c=0;c<5;c++){
    if(board[c]===board[c+5]&&board[c]===board[c+10]) add([c,c+5,c+10],3);
  }

  for(let c=0;c<=2;c++){
    const i=c;
    if(board[i]===board[i+6]&&board[i]===board[i+12]) add([i,i+6,i+12],3);
  }

  for(let c=2;c<5;c++){
    const i=c;
    if(board[i]===board[i+4]&&board[i]===board[i+8]) add([i,i+4,i+8],3);
  }

  won.forEach(i=>cells[i].classList.add("win"));
  return reward;
}

function jackpotReward(cells,jackpotSymbol){
  document.querySelectorAll(".cell").forEach(c=>c.classList.add("win"));
  beep(900,0.45);
  return (75+symbolPayouts[jackpotSymbol])*shopMult*streakMult;
}

function finishSpin(reward,message){
  const usedMult=shopMult*streakMult;
  if(sickleRolls>0&&reward>0){
    reward*=2;
    sickleRolls--;
    message=(message||`WIN! Mult x${usedMult}`)+" | Sickle x2";
  }else if(sickleRolls>0){
    sickleRolls--;
  }

  if(reward>0){
    streakMult=Math.min(streakMult+1,5);
    beep(700,0.2);
    document.getElementById("info").textContent=message||`WIN! Mult x${usedMult}`;
  }else{
    streakMult=1;
    document.getElementById("info").textContent="No win";
  }

  if(!infiniteCoins) coins+=reward;
  spinning=false;
  document.getElementById("earned").textContent="💰 Earned: "+reward;
  checkSacks();
  update();
  maybeShowSickleOffer();
}

function spin(){
  if(spinBatch===5){
    spinFive();
    return;
  }
  checkSacks();
  if((!infiniteCoins&&coins<=0)||spinning) return;
  spinning=true;
  if(!infiniteCoins) coins--;
  clearWin();
  beep(300,0.08);
  update();

  const cells=document.getElementsByClassName("cell");
  const luckySymbol=luck>0?symbols[Math.floor(Math.random()*symbols.length)]:null;
  const isJackpot=Math.random()<(0.015+jackpotLevel*0.005);
  let t=0;

  const anim=setInterval(()=>{
    for(let i=0;i<15;i++){
      cells[i].textContent=symbols[Math.floor(Math.random()*symbols.length)];
    }
    t++;
    if(t>15){
      clearInterval(anim);

      if(isJackpot){
        const jackpotSymbol=symbols[Math.floor(Math.random()*symbols.length)];
        const board=Array(15).fill(jackpotSymbol);
        grid.classList.add("jackpot-mode");
        document.getElementById("info").classList.add("jackpot-text");

        for(let r=0;r<3;r++){
          for(let c=0;c<4;c++){
            const lockedCell=cells[r*5+c];
            lockedCell.textContent=jackpotSymbol;
            lockedCell.classList.add("locked");
          }
        }

        for(let r=0;r<3;r++){
          cells[r*5+4].classList.add("suspense");
        }

        document.getElementById("info").textContent="";
        playJackpotBuild();
        let suspense=0;
        function finalColumnTick(){
          const spinningRows=suspense<8?[0,1,2]:suspense<16?[1,2]:[2];
          spinningRows.forEach(r=>{
            cells[r*5+4].textContent=symbols[Math.floor(Math.random()*symbols.length)];
          });
          if(suspense>=16){
            cells[14].classList.add("final-focus");
          }
          suspense++;

          if(suspense===8){
            const firstCell=cells[4];
            firstCell.textContent=jackpotSymbol;
            firstCell.classList.remove("suspense");
            firstCell.classList.add("locked","jackpot-pop");
            beep(520,0.1);
          }

          if(suspense===16){
            const secondCell=cells[9];
            secondCell.textContent=jackpotSymbol;
            secondCell.classList.remove("suspense");
            secondCell.classList.add("locked","jackpot-pop");
            cells[14].classList.add("final-focus");
            beep(640,0.12);
          }

          if(suspense>27){
            playJackpotDrop();
            for(let r=0;r<3;r++){
              const finalCell=cells[r*5+4];
              finalCell.textContent=jackpotSymbol;
              finalCell.classList.remove("suspense","final-focus");
              finalCell.classList.add("jackpot-pop");
            }

            const reward=jackpotReward(cells,jackpotSymbol);
            finishSpin(reward,`JACKPOT! ${jackpotSymbol} Mult x${shopMult*streakMult} | ${jackpotSymbol} Payout +${symbolPayouts[jackpotSymbol]}`);
            setTimeout(()=>{
              grid.classList.remove("jackpot-mode");
              document.getElementById("info").classList.remove("jackpot-text");
              document.querySelectorAll(".cell").forEach(c=>c.classList.remove("locked","final-focus","jackpot-pop"));
            },1800);
          }else{
            const slowPhase=Math.max(0,suspense-16);
            const nextDelay=70+Math.pow(slowPhase/11,2)*135;
            setTimeout(finalColumnTick,nextDelay);
          }
        }
        finalColumnTick();
        return;
      }

      const board=[];
      for(let i=0;i<15;i++){
        board[i]=randomSymbol(luckySymbol);
        cells[i].textContent=board[i];
      }

      const reward=evaluateBoard(board,cells);
      const luckyText=luckySymbol?` | Lucky ${luckySymbol}`:"";
      finishSpin(reward,reward>0?`WIN! Mult x${shopMult*streakMult}${luckyText}`:null);
    }
  },55);
}

function spinMiniBoard(cells){
  return new Promise(resolve=>{
    const luckySymbol=luck>0?symbols[Math.floor(Math.random()*symbols.length)]:null;
    let t=0;
    cells.forEach(c=>c.classList.remove("win"));
    const anim=setInterval(()=>{
      cells.forEach(cell=>{
        cell.textContent=symbols[Math.floor(Math.random()*symbols.length)];
      });
      t++;
      if(t>16){
        clearInterval(anim);
        const board=[];
        for(let i=0;i<15;i++){
          board[i]=randomSymbol(luckySymbol);
          cells[i].textContent=board[i];
        }
        resolve(evaluateBoard(board,cells));
      }
    },50);
  });
}

function spinFive(){
  checkSacks();
  if(spinning||(!infiniteCoins&&coins<5)) return;
  spinning=true;
  clearWin();
  if(!infiniteCoins) coins-=5;
  beep(340,0.1);
  update();

  const mainCells=Array.from(document.getElementsByClassName("cell"));
  Promise.all([spinMiniBoard(mainCells),...miniBoards.map(cells=>spinMiniBoard(cells))]).then(rewards=>{
    let total=rewards.reduce((sum,val)=>sum+val,0);
    let message=total>0?`5x spin won ${total}`:"5x spin: no win";
    if(sickleRolls>0){
      if(total>0){
        total*=2;
        message=`5x spin won ${total} | Sickle x2`;
      }
      sickleRolls--;
    }
    if(total>0){
      streakMult=Math.min(streakMult+1,5);
      document.getElementById("info").textContent=message;
      beep(740,0.18);
    }else{
      streakMult=1;
      document.getElementById("info").textContent=message;
    }
    if(!infiniteCoins) coins+=total;
    spinning=false;
    document.getElementById("earned").textContent="💰 Earned: "+total;
    checkSacks();
    update();
    maybeShowSickleOffer();
  });
}

function buyLuck(){
  const cost=luckCost();
  if(!spinning&&spend(cost)){
    luck++;
    document.getElementById("info").textContent=`Luck upgraded to ${luck}`;
    update();
  }
}

function buyMult(){
  const cost=multCost();
  if(!spinning&&spend(cost)){
    shopMult++;
    document.getElementById("info").textContent=`Multiplier upgraded to x${shopMult}`;
    update();
  }
}

function buyPayout(symbol){
  const cost=payoutCost(symbol);
  if(!spinning&&spend(cost)){
    symbolPayouts[symbol]++;
    document.getElementById("info").textContent=`${symbol} payout upgraded to +${symbolPayouts[symbol]}`;
    update();
  }
}

function togglePayouts(){
  const choices=document.getElementById("payoutChoices");
  const isHidden=choices.hidden;
  choices.hidden=!isHidden;
  const toggle=document.getElementById("payoutToggle");
  toggle.textContent=isHidden?"Hide Payout Upgrades":"Show Payout Upgrades";
  toggle.setAttribute("aria-expanded",String(isHidden));
}

function buyJackpot(){
  const cost=jackpotCost();
  if(!spinning&&spend(cost)){
    jackpotLevel++;
    document.getElementById("info").textContent=`Jackpot chance upgraded to ${Math.round((0.015+jackpotLevel*0.005)*100)}%`;
    update();
  }
}

function buySack(){
  if(!spinning&&spend(sackCost())){
    coinSacks++;
    document.getElementById("info").textContent=`Sack of Coins saved: ${coinSacks}`;
    update();
  }
}

function buySickle(){
  if(!sickleOfferActive) return;
  const cost=sickleCost();
  if(!spinning&&spend(cost)){
    sickleRolls+=2;
    hideSickleOffer();
    document.getElementById("info").textContent="Sickle ready: next 2 spins pay x2";
    update();
  }
}

function toggleAudio(){
  audioOn=!audioOn;
  update();
}

function toggleSpinMode(){
  if(spinning) return;
  spinBatch=spinBatch===5?1:5;
  update();
}

function openDoubleOrNothing(){
  if(spinning) return;
  doubleChoice=null;
  const coin=document.getElementById("flipCoin");
  coin.textContent="🐔";
  coin.classList.remove("flipping");
  document.getElementById("doubleModal").classList.add("active");
}

function closeDoubleOrNothing(){
  document.getElementById("doubleModal").classList.remove("active");
}

function resetUpgrades(){
  shopMult=1;
  streakMult=1;
  luck=0;
  jackpotLevel=0;
  sickleRolls=0;
  Object.keys(symbolPayouts).forEach(symbol=>symbolPayouts[symbol]=0);
}

function chooseDoubleOrNothing(choice){
  if(spinning) return;
  doubleChoice=choice;
  const coin=document.getElementById("flipCoin");
  const heads=Math.random()<0.5;
  const result=heads?"heads":"tails";
  coin.classList.remove("flipping");
  void coin.offsetWidth;
  coin.classList.add("flipping");
  beep(520,0.1);

  setTimeout(()=>{
    coin.classList.remove("flipping");
    coin.textContent=heads?"🐔":"🐔🍑";
    const won=doubleChoice===result;
    if(won){
      const gained=infiniteCoins?"Infinity":coins;
      if(!infiniteCoins) coins*=2;
      document.getElementById("earned").textContent="💰 Earned: "+gained;
      document.getElementById("info").textContent=`${heads?"🐔 Heads":"🐔🍑 Tails"}! You guessed right. Coins doubled!`;
      beep(880,0.22);
    }else{
      coins=0;
      infiniteCoins=false;
      resetUpgrades();
      document.getElementById("earned").textContent="💰 Earned: 0";
      document.getElementById("info").textContent=`${heads?"🐔 Heads":"🐔🍑 Tails"}. Wrong guess. Everything is gone.`;
      beep(110,0.35);
      checkSacks();
    }
    update();
    setTimeout(closeDoubleOrNothing,900);
  },2100);
}

function openMenu(){
  document.getElementById("menuModal").classList.add("active");
}

function closeMenu(){
  document.getElementById("menuModal").classList.remove("active");
}

function openCodes(){
  closeMenu();
  document.getElementById("codesModal").classList.add("active");
  document.getElementById("codeInput").focus();
}

function closeCodes(){
  document.getElementById("codesModal").classList.remove("active");
}

function submitCode(){
  const code=document.getElementById("codeInput").value.trim();
  if(code==="I love fried chicken"){
    infiniteCoins=true;
    coins=999999999;
    document.getElementById("info").textContent="Code accepted: infinite coins";
    beep(980,0.22);
    closeCodes();
    update();
  }else{
    document.getElementById("info").textContent="Code not found";
    beep(180,0.12);
  }
}

update();
</script>
