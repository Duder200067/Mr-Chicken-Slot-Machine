<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Chicken Slot Machine</title>
<style>
:root{
  --gold:#d18b00;
  --gold-dark:#9b6400;
  --cream:#fff7d6;
  --green:#188a39;
  --ink:#302410;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  text-align:center;
  color:var(--ink);
  background:
    radial-gradient(circle at top left, #ffe691 0, transparent 32%),
    linear-gradient(180deg,#fff7d6 0%,#ffe9a3 100%);
}
main{
  width:min(96vw,640px);
  margin:0 auto;
  padding:24px 12px 30px;
}
h1{
  margin:0 0 14px;
  color:var(--gold-dark);
  font-size:clamp(2rem,7vw,3.3rem);
}
.machine{
  position:relative;
  padding:16px;
  border:4px solid var(--gold);
  border-radius:14px;
  background:#fffdf2;
  box-shadow:0 10px 28px rgba(92,58,0,.2);
}
.grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(54px,90px));
  gap:6px;
  justify-content:center;
  margin:4px auto 16px;
  transition:transform .35s ease, filter .35s ease;
}
.mini-slots{
  display:none;
  grid-template-columns:190px 190px;
  grid-template-areas:"lt rt" "lb rb";
  grid-template-rows:1fr 1fr;
  gap:10px;
  position:absolute;
  left:50%;
  top:70px;
  width:min(96vw,1040px);
  min-height:300px;
  transform:translateX(-50%);
  justify-content:space-between;
  align-items:stretch;
  pointer-events:none;
  z-index:1;
}
.mini-slots.active{
  display:grid;
}
.mini-grid:nth-child(1){grid-area:lt}
.mini-grid:nth-child(2){grid-area:lb}
.mini-grid:nth-child(3){grid-area:rt}
.mini-grid:nth-child(4){grid-area:rb}
.mini-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:3px;
  padding:6px;
  border:2px solid var(--gold);
  border-radius:8px;
  background:#fffaf0;
  pointer-events:auto;
  min-height:142px;
  width:190px;
  overflow:hidden;
}
.mini-cell{
  min-width:0;
  aspect-ratio:1;
  border:1px solid #d18b00;
  border-radius:5px;
  background:white;
  font-size:clamp(15px,2.4vw,22px);
  display:flex;
  align-items:center;
  justify-content:center;
}
.mini-cell.win{
  background:#fff59d;
  box-shadow:0 0 8px gold;
}
.cell{
  aspect-ratio:1;
  border:3px solid var(--gold);
  border-radius:10px;
  background:white;
  font-size:clamp(28px,8vw,42px);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .18s, box-shadow .18s, transform .18s;
}
.win{
  background:#fff59d;
  box-shadow:0 0 14px gold;
  transform:scale(1.04);
}
.grid.jackpot-mode{
  transform:scale(1.08);
  filter:drop-shadow(0 12px 22px rgba(209,139,0,.32));
}
.cell.locked{
  background:#fff2a6;
  box-shadow:0 0 18px rgba(255,191,0,.78);
  animation:lockedPulse .55s ease-in-out infinite alternate;
}
.cell.suspense{
  z-index:2;
  border-color:#ff5b35;
  background:#fff;
  box-shadow:0 0 26px rgba(255,91,53,.95),0 0 48px rgba(255,213,79,.9);
  animation:suspenseShake .16s linear infinite, suspenseGlow .5s ease-in-out infinite alternate;
}
.cell.final-focus{
  z-index:3;
  border-color:#ff2d00;
  box-shadow:0 0 34px rgba(255,45,0,1),0 0 70px rgba(255,213,79,1);
  animation:finalFocusShake .13s linear infinite, suspenseGlow .38s ease-in-out infinite alternate;
}
.cell.jackpot-pop{
  animation:jackpotPop .7s cubic-bezier(.2,1.5,.35,1) both;
}
#info.jackpot-text{
  font-size:clamp(1.15rem,4vw,1.65rem);
  color:#c83d13;
  text-shadow:0 0 14px rgba(255,213,79,.85);
  animation:textPulse .45s ease-in-out infinite alternate;
}
@keyframes lockedPulse{
  from{transform:scale(1);filter:saturate(1)}
  to{transform:scale(1.06);filter:saturate(1.35)}
}
@keyframes suspenseShake{
  0%,100%{transform:scale(1.22) rotate(-2deg)}
  50%{transform:scale(1.31) rotate(2deg)}
}
@keyframes finalFocusShake{
  0%,100%{transform:scale(1.48) rotate(-3deg)}
  50%{transform:scale(1.62) rotate(3deg)}
}
@keyframes suspenseGlow{
  from{filter:saturate(1)}
  to{filter:saturate(1.8)}
}
@keyframes jackpotPop{
  0%{transform:scale(1.35) rotate(-4deg)}
  55%{transform:scale(1.7) rotate(3deg)}
  100%{transform:scale(1.08) rotate(0)}
}
@keyframes textPulse{
  from{transform:scale(1)}
  to{transform:scale(1.05)}
}
button{
  min-height:42px;
  padding:10px 14px;
  margin:5px;
  border:2px solid var(--gold);
  border-radius:8px;
  background:#fff6c7;
  color:#3c2a00;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#ffe88c}
button:disabled{
  opacity:.55;
  cursor:not-allowed;
}
#spinBtn{
  width:min(260px,90%);
  font-size:1.08rem;
  background:#ffd54f;
}
.spin-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}
#spinModeBtn,#audioBtn,#menuBtn{
  min-width:84px;
}
#audioBtn{display:none}
.panel{
  border:1px solid #c7aa55;
  background:white;
  width:min(100%,360px);
  margin:14px auto;
  padding:12px;
  border-radius:10px;
}
.panel-title{
  display:block;
  margin-bottom:6px;
  font-size:1.08rem;
}
#market{
  border-width:2px;
  border-color:var(--gold);
  background:#fffaf0;
  margin-bottom:0;
}
#stats{
  margin-top:8px;
  font-weight:bold;
}
#earned{
  min-height:34px;
  font-size:28px;
  color:var(--green);
  font-weight:bold;
  margin-top:10px;
}
#info{
  min-height:24px;
  font-weight:bold;
  color:var(--gold-dark);
}
#darkCoin{
  position:fixed;
  left:12px;
  bottom:12px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:3px solid #1d160d;
  background:radial-gradient(circle at 35% 30%,#4b3a1d,#111 68%);
  box-shadow:0 0 16px rgba(0,0,0,.55);
  cursor:pointer;
}
#sideMenu{
  position:fixed;
  right:12px;
  top:12px;
  z-index:8;
}
#sickleOffer{
  display:none;
  position:fixed;
  right:12px;
  bottom:12px;
  z-index:9;
  padding:12px;
  border:3px solid var(--gold);
  border-radius:10px;
  background:#fffdf2;
  box-shadow:0 12px 28px rgba(48,36,16,.28);
}
#sickleOffer.active{
  display:block;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:12;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(28,20,10,.52);
}
.modal.active{
  display:flex;
}
#doubleModal.dark-flip{
  background:rgba(0,0,0,.78);
}
.help-grid{
  display:grid;
  grid-template-columns:repeat(5,18px);
  grid-template-rows:repeat(3,18px);
  gap:3px;
  justify-content:center;
  margin:6px auto 12px;
}
.help-dot{
  width:18px;
  height:18px;
  border:1px solid #d18b00;
  border-radius:4px;
  background:#fffdf2;
}
.help-dot.on{
  background:#fff59d;
  box-shadow:0 0 7px gold;
}
.help-list{
  max-height:58vh;
  overflow:auto;
  text-align:left;
}
.help-item{
  display:grid;
  grid-template-columns:84px 1fr;
  align-items:center;
  gap:10px;
  border-top:1px solid #efd58c;
  padding:8px 0;
}
.menu-toggle{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin:8px 0;
}
.modal-card{
  position:relative;
  z-index:2;
  width:min(94vw,390px);
  padding:18px;
  border:4px solid var(--gold);
  border-radius:12px;
  background:#fffdf2;
  box-shadow:0 18px 40px rgba(48,36,16,.35);
}
.modal-card h2{
  margin:0 0 8px;
  color:var(--gold-dark);
}
.modal-card input{
  width:min(100%,280px);
  padding:10px;
  border:2px solid #c7aa55;
  border-radius:8px;
  font:inherit;
}
#doubleModal .modal-card{
  overflow:hidden;
}
.pool-table{
  position:relative;
  overflow:hidden;
  height:170px;
  margin:12px 0;
  border:8px solid #6b3d16;
  border-radius:18px;
  background:radial-gradient(circle at center,#22865b,#0f593b 72%);
  box-shadow:inset 0 0 18px rgba(0,0,0,.35);
}
.black-hole{
  position:fixed;
  left:50%;
  top:50%;
  width:33vmax;
  height:33vmax;
  min-width:320px;
  min-height:320px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:
    radial-gradient(circle,#000 0 31%,#16001f 34% 43%,#46115c 44% 53%,rgba(0,0,0,0) 68%),
    conic-gradient(from 0deg,#000,#341045,#050105,#5d177a,#000);
  opacity:0;
  filter:blur(.2px);
  animation:blackHoleSpin 5s linear infinite, blackHoleDrift 4.8s ease-in-out infinite alternate;
  transition:opacity .25s ease;
  z-index:1;
  pointer-events:none;
}
#doubleModal.active .black-hole{
  opacity:.72;
}
#doubleModal.dark-flip .black-hole{
  opacity:.95;
}
#flipCoin{
  position:absolute;
  left:calc(50% - 36px);
  top:48px;
  width:72px;
  height:72px;
  border-radius:50%;
  border:4px solid #a96e00;
  background:#ffd54f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  box-shadow:0 8px 18px rgba(0,0,0,.35);
  z-index:2;
}
#flipCoin.flipping{
  animation:coinFlip 1.95s cubic-bezier(.18,.78,.18,1) both;
}
@keyframes coinFlip{
  0%{transform:rotateY(0) translateY(0)}
  16%{transform:rotateY(220deg) translateY(-34px)}
  32%{transform:rotateY(500deg) translateY(-70px)}
  50%{transform:rotateY(780deg) translateY(-96px)}
  68%{transform:rotateY(1040deg) translateY(-62px)}
  84%{transform:rotateY(1260deg) translateY(-24px)}
  100%{transform:rotateY(1440deg) translateY(0)}
}
@keyframes blackHoleSpin{
  to{transform:translate(-50%,-50%) rotate(360deg)}
}
@keyframes blackHoleDrift{
  from{margin-left:-12px;margin-top:7px}
  to{margin-left:14px;margin-top:-10px}
}
@media(max-width:880px){
  .mini-slots{
    position:static;
    transform:none;
    width:100%;
    min-height:0;
    grid-template-columns:repeat(2,minmax(0,1fr));
    grid-template-areas:"lt rt" "lb rb";
    gap:8px;
    margin:8px auto 14px;
  }
  .mini-grid{
    width:100%;
    min-height:0;
  }
  .mini-cell{font-size:clamp(14px,5vw,20px)}
}
</style>
</head>
<body>
<main>
  <h1>🐔 Mr. Chicken Slot Machine</h1>
  <section class="machine" aria-label="Slot machine">
    <div class="grid" id="grid"></div>
    <div class="mini-slots" id="miniSlots"></div>
    <div class="spin-row">
      <button id="spinBtn" onclick="spin()">SPIN (1 coin)</button>
      <button id="spinModeBtn" onclick="toggleSpinMode()">5x Toggle</button>
      <button id="audioBtn" onclick="toggleAudio()">Audio On</button>
    </div>

    <div id="stats"></div>
    <div id="earned">💰 Earned: 0</div>
    <div id="info"></div>

    <div id="market" class="panel">
      <span class="panel-title"><b>🏪 Market</b></span>
      <button id="luckBtn" onclick="buyLuck()">🍀 Luck (25)</button>
      <button id="multBtn" onclick="buyMult()">🔥 Multiplier (50)</button>
      <button id="jackpotBtn" onclick="buyJackpot()">🎰 Jackpot Chance (40)</button>
      <button id="sackBtn" onclick="buySack()">💼 Sack of Coins (10)</button>
    </div>
  </section>
</main>

<button id="sideMenu" onclick="openMenu()">Menu</button>
<button id="darkCoin" aria-label="Double or nothing" onclick="openDoubleOrNothing()"></button>
<div id="sickleOffer">
  <div><b>🌾 Sickle appeared!</b></div>
  <button onclick="buySickle()">Buy for 80%</button>
</div>

<div id="doubleModal" class="modal" aria-live="polite">
  <div class="black-hole" aria-hidden="true"></div>
  <div class="modal-card">
    <h2>Double or Nothing</h2>
    <p>Wager as many coins as you would like. If it lands on your side, your coins double. If it lands on the opposite side, you loose half your coins.</p>
    <input id="doubleWager" type="number" min="2" step="2" value="2" aria-label="Coin wager">
    <div class="pool-table">
      <div id="flipCoin">🐔</div>
    </div>
    <button onclick="chooseDoubleOrNothing('heads')">Heads 🐔</button>
    <button onclick="chooseDoubleOrNothing('tails')">Tails 🐤</button>
    <button onclick="closeDoubleOrNothing()">Cancel</button>
  </div>
</div>

<div id="codesModal" class="modal" aria-live="polite">
  <div class="modal-card">
    <h2>Codes</h2>
    <input id="codeInput" placeholder="Enter code">
    <br>
    <button onclick="submitCode()">Submit</button>
    <button onclick="closeCodes()">Close</button>
  </div>
</div>

<div id="menuModal" class="modal" aria-live="polite">
  <div class="modal-card">
    <h2>Menu</h2>
    <button onclick="toggleAudio()" id="menuAudioBtn">Audio On</button>
    <label class="menu-toggle"><input id="showPatternsToggle" type="checkbox" checked onchange="togglePatternReveal()"> Show patterns</label>
    <button onclick="openHelp()">How It Works</button>
    <button onclick="openCodes()">Codes</button>
    <button onclick="closeMenu()">Close</button>
  </div>
</div>

<div id="helpModal" class="modal" aria-live="polite">
  <div class="modal-card">
    <h2>How It Works</h2>
    <div id="helpContent" class="help-list"></div>
    <button onclick="closeHelp()">Close</button>
  </div>
</div>

<script>
let coins=30,shopMult=1,streakMult=1,luck=0,jackpotLevel=0,spinning=false,guaranteedJackpot=false,showPatternReveal=true;
let coinSacks=0,spinBatch=1,audioOn=true,sickleRolls=0,infiniteCoins=false,doubleChoice=null,sickleOfferActive=false,sickleOfferTimer=null;
const masterVolume=1.1;
const symbols=["🐔","🐦","🌽","🚜","🌾","💧"];
const symbolPayouts=Object.fromEntries(symbols.map(symbol=>[symbol,0]));
const grid=document.getElementById("grid");
const miniSlots=document.getElementById("miniSlots");

for(let i=0;i<15;i++){
  const d=document.createElement("div");
  d.className="cell";
  d.textContent="❔";
  grid.appendChild(d);
}

const miniBoards=[];
for(let b=0;b<4;b++){
  const board=document.createElement("div");
  board.className="mini-grid";
  const cells=[];
  for(let i=0;i<15;i++){
    const d=document.createElement("div");
    d.className="mini-cell";
    d.textContent="❔";
    board.appendChild(d);
    cells.push(d);
  }
  miniSlots.appendChild(board);
  miniBoards.push(cells);
}

function beep(freq,dur){
  if(!audioOn) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.frequency.value=freq;
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    g.gain.setValueAtTime(0.08*masterVolume,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
    o.stop(ctx.currentTime+dur);
  }catch(e){}
}

function playTone(ctx,freq,start,dur,type="sine",volume=0.08){
  if(!audioOn) return;
  const o=ctx.createOscillator();
  const g=ctx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,start);
  g.gain.setValueAtTime(0.0001,start);
  g.gain.exponentialRampToValueAtTime(volume*masterVolume,start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
  o.connect(g);
  g.connect(ctx.destination);
  o.start(start);
  o.stop(start+dur+0.03);
}

function playJackpotBuild(){
  if(!audioOn) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const now=ctx.currentTime;
    const notes=[220,277,330,415,554,660,831,988];

    for(let i=0;i<22;i++){
      const start=now+i*0.125;
      const freq=notes[i%notes.length]*(i>15?1.5:1);
      playTone(ctx,freq,start,0.09,i%2?"square":"triangle",0.045+i*0.002);
      if(i%4===0) playTone(ctx,110,start,0.06,"sawtooth",0.035);
    }

    const riser=ctx.createOscillator();
    const gain=ctx.createGain();
    riser.type="sawtooth";
    riser.frequency.setValueAtTime(180,now);
    riser.frequency.exponentialRampToValueAtTime(1200,now+2.75);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.055,now+0.2);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+2.78);
    riser.connect(gain);
    gain.connect(ctx.destination);
    riser.start(now);
    riser.stop(now+2.8);
  }catch(e){}
}

function playJackpotDrop(){
  if(!audioOn) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const now=ctx.currentTime;
    playTone(ctx,82,now,0.5,"sawtooth",0.16);
    playTone(ctx,164,now,0.32,"square",0.11);
    playTone(ctx,659,now+0.02,0.18,"triangle",0.12);
    playTone(ctx,988,now+0.12,0.16,"triangle",0.09);
    playTone(ctx,1318,now+0.24,0.22,"triangle",0.08);
    playTone(ctx,55,now+0.28,0.35,"sine",0.14);
  }catch(e){}
}

function playDarkFlipMusic(){
  if(!audioOn) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const now=ctx.currentTime;
    [73,65,58,49,55,41].forEach((freq,i)=>{
      playTone(ctx,freq,now+i*0.28,0.32,i%2?"sawtooth":"sine",0.06);
      playTone(ctx,freq*2,now+i*0.28+0.08,0.2,"triangle",0.025);
    });
  }catch(e){}
}

function playPatternSound(pattern,index){
  beep(420+pattern.amount*18+index*30,0.11);
}

function playJackpotLadder(){
  [420,480,540,610,690,780,890,1010,1160,1320,1500,1700,1920,2160,2440].forEach((freq,i)=>{
    setTimeout(()=>beep(freq,0.06),i*45);
  });
}

function scaledCost(base,level,growth){
  return Math.ceil((base*Math.pow(growth,level))/5)*5;
}

function luckCost(){ return scaledCost(25,luck,1.485); }
function multCost(){ return scaledCost(50,shopMult-1,2.025); }
function jackpotCost(){ return scaledCost(40,jackpotLevel,1.62); }
function sackCost(){ return 10; }
function sickleCost(){ return Math.max(1,Math.round(coins*0.8)); }

function randomSymbol(luckySymbol){
  const luckyChance=Math.min(0.35,luck*0.025);
  if(luckySymbol&&Math.random()<luckyChance) return luckySymbol;
  return symbols[Math.floor(Math.random()*symbols.length)];
}

function spend(cost){
  if(infiniteCoins) return true;
  if(coins<cost) return false;
  coins-=cost;
  return true;
}

function checkSacks(){
  if(!infiniteCoins&&coins<=0&&coinSacks>0){
    const rescue=coinSacks*10;
    coins+=rescue;
    coinSacks=0;
    document.getElementById("info").textContent=`Sack of Coins rescued you with ${rescue} coins`;
    document.getElementById("earned").textContent="💰 Earned: "+rescue;
    beep(620,0.18);
    return true;
  }
  return false;
}

function update(){
  const coinText=infiniteCoins?"Infinity":coins;
  document.getElementById("stats").textContent=`Coins: ${coinText} | Mult: x${shopMult} | Streak: x${streakMult} | Luck: ${luck} | Jackpot: ${Math.round((0.015+jackpotLevel*0.005)*100)}% | Sacks: ${coinSacks} | Sickle: ${sickleRolls}`;
  document.getElementById("spinBtn").textContent=spinBatch===5?"SPIN 5x (1 coin each)":"SPIN (1 coin)";
  document.getElementById("spinModeBtn").textContent=spinBatch===5?"1x Toggle":"5x Toggle";
  document.getElementById("audioBtn").textContent=audioOn?"Audio On":"Audio Off";
  document.getElementById("menuAudioBtn").textContent=audioOn?"Audio On":"Audio Off";
  miniSlots.classList.toggle("active",spinBatch===5);
  document.getElementById("spinBtn").disabled=spinning||(!infiniteCoins&&coins<spinBatch&&!(coins<=0&&coinSacks>0));
  document.getElementById("luckBtn").textContent=`🍀 Luck (${luckCost()})`;
  document.getElementById("multBtn").textContent=`🔥 Multiplier (${multCost()})`;
  document.getElementById("jackpotBtn").textContent=`🎰 Jackpot Chance (${jackpotCost()})`;
  document.getElementById("sackBtn").textContent=`💼 Sack of Coins (${sackCost()})`;
  document.getElementById("luckBtn").disabled=spinning||(!infiniteCoins&&coins<luckCost());
  document.getElementById("multBtn").disabled=spinning||(!infiniteCoins&&coins<multCost());
  document.getElementById("jackpotBtn").disabled=spinning||(!infiniteCoins&&coins<jackpotCost());
  document.getElementById("sackBtn").disabled=spinning||(!infiniteCoins&&coins<sackCost());
}

function maybeShowSickleOffer(){
  if(sickleOfferActive||spinning||infiniteCoins) return;
  if(Math.random()>=0.03) return;
  sickleOfferActive=true;
  const offer=document.getElementById("sickleOffer");
  offer.classList.add("active");
  clearTimeout(sickleOfferTimer);
  sickleOfferTimer=setTimeout(hideSickleOffer,10000);
}

function hideSickleOffer(){
  sickleOfferActive=false;
  document.getElementById("sickleOffer").classList.remove("active");
  clearTimeout(sickleOfferTimer);
  sickleOfferTimer=null;
}

function clearWin(){
  grid.classList.remove("jackpot-mode");
  document.getElementById("info").classList.remove("jackpot-text");
  document.querySelectorAll(".cell").forEach(c=>c.classList.remove("win","locked","suspense","final-focus","jackpot-pop"));
  document.querySelectorAll(".mini-cell").forEach(c=>c.classList.remove("win"));
}

function patternAmount(pattern){
  return (pattern.val+symbolPayouts[pattern.symbol])*shopMult*streakMult;
}

function findPatterns(board){
  const patterns=[];

  function add(idxs,val,name){
    const symbol=board[idxs[0]];
    patterns.push({idxs,val,symbol,name});
  }

  const eyeIdxs=[0,1,2,3,4,5,7,9,10,11,12,13,14];
  if(eyeIdxs.every(i=>board[i]===board[0])){
    add(eyeIdxs,30,"eye");
  }

  const zigIdxs=[0,6,2,8,4];
  if(zigIdxs.every(i=>board[i]===board[zigIdxs[0]])){
    add(zigIdxs,8,"zig");
  }

  const zagIdxs=[10,6,12,8,14];
  if(zagIdxs.every(i=>board[i]===board[zagIdxs[0]])){
    add(zagIdxs,8,"zag");
  }

  for(let r=0;r<3;r++){
    const b=r*5;
    if(board[b]===board[b+1]&&board[b]===board[b+2]&&board[b]===board[b+3]&&board[b]===board[b+4]){
      add([b,b+1,b+2,b+3,b+4],10,"1 by 5");
    }else{
      if(board[b]===board[b+1]&&board[b]===board[b+2]&&board[b]===board[b+3]) add([b,b+1,b+2,b+3],5,"1 by 4");
      if(board[b+1]===board[b+2]&&board[b+1]===board[b+3]&&board[b+1]===board[b+4]) add([b+1,b+2,b+3,b+4],5,"1 by 4");

      for(let start=0;start<=2;start++){
        const i=b+start;
        if(board[i]===board[i+1]&&board[i]===board[i+2]) add([i,i+1,i+2],3,"1 by 3");
      }
    }
  }

  for(let c=0;c<5;c++){
    if(board[c]===board[c+5]&&board[c]===board[c+10]) add([c,c+5,c+10],3,"3 by 1");
  }

  for(let c=0;c<=2;c++){
    const i=c;
    if(board[i]===board[i+6]&&board[i]===board[i+12]) add([i,i+6,i+12],3,"diagonal");
  }

  for(let c=2;c<5;c++){
    const i=c;
    if(board[i]===board[i+4]&&board[i]===board[i+8]) add([i,i+4,i+8],3,"diagonal");
  }

  if(board.every(symbol=>symbol===board[0])){
    add([...Array(15).keys()],75,"jackpot");
  }

  patterns.forEach(pattern=>pattern.amount=patternAmount(pattern));
  patterns.sort((a,b)=>a.amount-b.amount||a.val-b.val);
  return patterns;
}

function evaluateBoard(board,cells,animate=false){
  const patterns=findPatterns(board);
  const reward=patterns.reduce((sum,pattern)=>sum+pattern.amount,0);
  if(!animate){
    patterns.forEach(pattern=>pattern.idxs.forEach(i=>cells[i].classList.add("win")));
  }
  return {reward,patterns};
}

function animatePatterns(patterns,cells,done){
  if(patterns.length===0){
    done();
    return;
  }
  const cellList=Array.from(cells);
  if(!showPatternReveal){
    patterns.forEach(pattern=>pattern.idxs.forEach(i=>cells[i].classList.add("win")));
    done();
    return;
  }
  let index=0;
  function step(){
    cellList.forEach(cell=>cell.classList.remove("win"));
    const pattern=patterns[index];
    pattern.idxs.forEach(i=>cells[i].classList.add("win"));
    playPatternSound(pattern,index);
    document.getElementById("info").textContent=`${pattern.name}: +${pattern.amount}`;
    index++;
    if(index<patterns.length){
      setTimeout(step,520);
    }else{
      setTimeout(()=>{
        patterns.forEach(pattern=>pattern.idxs.forEach(i=>cells[i].classList.add("win")));
        done();
      },320);
    }
  }
  step();
}

function jackpotReward(cells,jackpotSymbol){
  document.querySelectorAll(".cell").forEach(c=>c.classList.add("win"));
  beep(900,0.45);
  playJackpotLadder();
  return (75+symbolPayouts[jackpotSymbol])*shopMult*streakMult;
}

function playJackpotAnimation(cells,jackpotSymbol,done){
  grid.classList.add("jackpot-mode");
  document.getElementById("info").classList.add("jackpot-text");
  document.getElementById("info").textContent="";
  document.querySelectorAll(".cell").forEach(c=>c.classList.remove("win","locked","suspense","final-focus","jackpot-pop"));

  for(let r=0;r<3;r++){
    for(let c=0;c<4;c++){
      const lockedCell=cells[r*5+c];
      lockedCell.textContent=jackpotSymbol;
      lockedCell.classList.add("locked");
    }
  }

  for(let r=0;r<3;r++){
    cells[r*5+4].classList.add("suspense");
  }

  playJackpotBuild();
  let suspense=0;
  function finalColumnTick(){
    const spinningRows=suspense<8?[0,1,2]:suspense<16?[1,2]:[2];
    spinningRows.forEach(r=>{
      cells[r*5+4].textContent=symbols[Math.floor(Math.random()*symbols.length)];
    });
    if(suspense>=16){
      cells[14].classList.add("final-focus");
    }
    suspense++;

    if(suspense===8){
      const firstCell=cells[4];
      firstCell.textContent=jackpotSymbol;
      firstCell.classList.remove("suspense");
      firstCell.classList.add("locked","jackpot-pop");
      beep(520,0.1);
    }

    if(suspense===16){
      const secondCell=cells[9];
      secondCell.textContent=jackpotSymbol;
      secondCell.classList.remove("suspense");
      secondCell.classList.add("locked","jackpot-pop");
      cells[14].classList.add("final-focus");
      beep(640,0.12);
    }

    if(suspense>27){
      playJackpotDrop();
      for(let r=0;r<3;r++){
        const finalCell=cells[r*5+4];
        finalCell.textContent=jackpotSymbol;
        finalCell.classList.remove("suspense","final-focus");
        finalCell.classList.add("jackpot-pop");
      }
      jackpotReward(cells,jackpotSymbol);
      done();
      setTimeout(()=>{
        grid.classList.remove("jackpot-mode");
        document.getElementById("info").classList.remove("jackpot-text");
        document.querySelectorAll(".cell").forEach(c=>c.classList.remove("locked","final-focus","jackpot-pop"));
      },1800);
    }else{
      const slowPhase=Math.max(0,suspense-16);
      const nextDelay=70+Math.pow(slowPhase/11,2)*135;
      setTimeout(finalColumnTick,nextDelay);
    }
  }
  finalColumnTick();
}

function finishSpin(reward,message){
  const usedMult=shopMult*streakMult;
  if(sickleRolls>0&&reward>0){
    reward*=2;
    sickleRolls--;
    message=(message||`WIN! Mult x${usedMult}`)+" | Sickle x2";
  }else if(sickleRolls>0){
    sickleRolls--;
  }

  if(reward>0){
    streakMult=Math.min(streakMult+1,5);
    beep(700,0.2);
    document.getElementById("info").textContent=message||`WIN! Mult x${usedMult}`;
  }else{
    streakMult=1;
    document.getElementById("info").textContent="No win";
  }

  if(!infiniteCoins) coins+=reward;
  spinning=false;
  document.getElementById("earned").textContent="💰 Earned: "+reward;
  checkSacks();
  update();
  maybeShowSickleOffer();
}

function spin(){
  if(spinBatch===5&&!guaranteedJackpot){
    spinFive();
    return;
  }
  checkSacks();
  if((!infiniteCoins&&coins<=0)||spinning) return;
  spinning=true;
  if(!infiniteCoins) coins--;
  clearWin();
  beep(300,0.08);
  update();

  const cells=document.getElementsByClassName("cell");
  const luckySymbol=luck>0?symbols[Math.floor(Math.random()*symbols.length)]:null;
  const isJackpot=guaranteedJackpot||Math.random()<(0.015+jackpotLevel*0.005);
  guaranteedJackpot=false;
  let t=0;

  const anim=setInterval(()=>{
    for(let i=0;i<15;i++){
      cells[i].textContent=symbols[Math.floor(Math.random()*symbols.length)];
    }
    t++;
    if(t>15){
      clearInterval(anim);

      if(isJackpot){
        const jackpotSymbol=symbols[Math.floor(Math.random()*symbols.length)];
        const board=Array(15).fill(jackpotSymbol);
        for(let i=0;i<15;i++){
          cells[i].textContent=jackpotSymbol;
        }
        const result=evaluateBoard(board,cells,true);
        const regularPatterns=result.patterns.filter(pattern=>pattern.name!=="jackpot");
        animatePatterns(regularPatterns,cells,()=>{
          playJackpotAnimation(cells,jackpotSymbol,()=>{
            finishSpin(result.reward,`JACKPOT! ${jackpotSymbol} Mult x${shopMult*streakMult}`);
          });
        });
        return;
      }

      const board=[];
      for(let i=0;i<15;i++){
        board[i]=randomSymbol(luckySymbol);
        cells[i].textContent=board[i];
      }

      const result=evaluateBoard(board,cells,true);
      const luckyText=luckySymbol?` | Lucky ${luckySymbol}`:"";
      animatePatterns(result.patterns,cells,()=>{
        finishSpin(result.reward,result.reward>0?`WIN! Mult x${shopMult*streakMult}${luckyText}`:null);
      });
    }
  },55);
}

function spinMiniBoard(cells){
  return new Promise(resolve=>{
    const luckySymbol=luck>0?symbols[Math.floor(Math.random()*symbols.length)]:null;
    let t=0;
    cells.forEach(c=>c.classList.remove("win"));
    const anim=setInterval(()=>{
      cells.forEach(cell=>{
        cell.textContent=symbols[Math.floor(Math.random()*symbols.length)];
      });
      t++;
      if(t>16){
        clearInterval(anim);
        const board=[];
        for(let i=0;i<15;i++){
          board[i]=randomSymbol(luckySymbol);
          cells[i].textContent=board[i];
        }
        resolve(evaluateBoard(board,cells).reward);
      }
    },50);
  });
}

function spinFive(){
  checkSacks();
  if(spinning||(!infiniteCoins&&coins<5)) return;
  spinning=true;
  clearWin();
  if(!infiniteCoins) coins-=5;
  beep(340,0.1);
  update();

  const mainCells=Array.from(document.getElementsByClassName("cell"));
  Promise.all([spinMiniBoard(mainCells),...miniBoards.map(cells=>spinMiniBoard(cells))]).then(rewards=>{
    let total=rewards.reduce((sum,val)=>sum+val,0);
    let message=total>0?`5x spin won ${total}`:"5x spin: no win";
    if(sickleRolls>0){
      if(total>0){
        total*=2;
        message=`5x spin won ${total} | Sickle x2`;
      }
      sickleRolls--;
    }
    if(total>0){
      streakMult=Math.min(streakMult+1,5);
      document.getElementById("info").textContent=message;
      beep(740,0.18);
    }else{
      streakMult=1;
      document.getElementById("info").textContent=message;
    }
    if(!infiniteCoins) coins+=total;
    spinning=false;
    document.getElementById("earned").textContent="💰 Earned: "+total;
    checkSacks();
    update();
    maybeShowSickleOffer();
  });
}

function buyLuck(){
  const cost=luckCost();
  if(!spinning&&spend(cost)){
    luck++;
    document.getElementById("info").textContent=`Luck upgraded to ${luck}`;
    update();
  }
}

function buyMult(){
  const cost=multCost();
  if(!spinning&&spend(cost)){
    shopMult++;
    document.getElementById("info").textContent=`Multiplier upgraded to x${shopMult}`;
    update();
  }
}

function buyJackpot(){
  const cost=jackpotCost();
  if(!spinning&&spend(cost)){
    jackpotLevel++;
    document.getElementById("info").textContent=`Jackpot chance upgraded to ${Math.round((0.015+jackpotLevel*0.005)*100)}%`;
    update();
  }
}

function buySack(){
  if(!spinning&&spend(sackCost())){
    coinSacks++;
    document.getElementById("info").textContent=`Sack of Coins saved: ${coinSacks}`;
    update();
  }
}

function buySickle(){
  if(!sickleOfferActive) return;
  const cost=sickleCost();
  if(!spinning&&spend(cost)){
    sickleRolls+=2;
    hideSickleOffer();
    document.getElementById("info").textContent="Sickle ready: next 2 spins pay x2";
    update();
  }
}

function toggleAudio(){
  audioOn=!audioOn;
  update();
}

function toggleSpinMode(){
  if(spinning) return;
  spinBatch=spinBatch===5?1:5;
  update();
}

function openDoubleOrNothing(){
  if(spinning) return;
  checkSacks();
  if(!infiniteCoins&&coins<2) return;
  doubleChoice=null;
  const coin=document.getElementById("flipCoin");
  const wager=document.getElementById("doubleWager");
  const maxEven=infiniteCoins?999999998:Math.max(0,coins-(coins%2));
  wager.value=Math.min(maxEven,Math.max(2,Number(wager.value)||2));
  wager.max=infiniteCoins?999999999:coins;
  coin.textContent="🐔";
  coin.classList.remove("flipping");
  document.getElementById("doubleModal").classList.add("active");
}

function closeDoubleOrNothing(){
  document.getElementById("doubleModal").classList.remove("active","dark-flip");
}

function chooseDoubleOrNothing(choice){
  if(spinning) return;
  const coin=document.getElementById("flipCoin");
  if(coin.classList.contains("flipping")) return;
  let wager=Math.floor(Number(document.getElementById("doubleWager").value));
  if(!Number.isFinite(wager)||wager<2){
    document.getElementById("info").textContent="Wager must be an even number of at least 2.";
    return;
  }
  if(wager%2!==0){
    document.getElementById("info").textContent="Wager must be even.";
    return;
  }
  if(!infiniteCoins) wager=Math.min(wager,coins);
  if(wager%2!==0) wager--;
  if(wager<2) return;
  doubleChoice=choice;
  const heads=Math.random()<0.5;
  const result=heads?"heads":"tails";
  if(!infiniteCoins) coins-=wager;
  document.getElementById("earned").textContent="💰 Earned: -"+wager;
  document.getElementById("info").textContent=`Wagered ${wager} coins...`;
  update();
  coin.classList.remove("flipping");
  void coin.offsetWidth;
  coin.classList.add("flipping");
  document.getElementById("doubleModal").classList.add("dark-flip");
  playDarkFlipMusic();
  beep(520,0.1);
  setTimeout(()=>{
    coin.textContent=heads?"🐔":"🐤";
  },1780);

  setTimeout(()=>{
    coin.classList.remove("flipping");
    coin.textContent=heads?"🐔":"🐤";
    const won=doubleChoice===result;
    if(won){
      const gained=infiniteCoins?"Infinity":wager*2;
      if(!infiniteCoins) coins+=wager*2;
      document.getElementById("earned").textContent="💰 Earned: "+gained;
      document.getElementById("info").textContent=`${heads?"🐔 Heads":"🐤 Tails"}! You guessed right. Wager doubled!`;
      beep(880,0.22);
    }else{
      document.getElementById("earned").textContent="💰 Earned: 0";
      document.getElementById("info").textContent=`${heads?"🐔 Heads":"🐤 Tails"}. Wrong guess. No coins came back.`;
      beep(110,0.35);
      checkSacks();
    }
    update();
    setTimeout(closeDoubleOrNothing,900);
  },2100);
}

function openMenu(){
  document.getElementById("menuModal").classList.add("active");
}

function closeMenu(){
  document.getElementById("menuModal").classList.remove("active");
}

function openCodes(){
  closeMenu();
  document.getElementById("codesModal").classList.add("active");
  document.getElementById("codeInput").focus();
}

function closeCodes(){
  document.getElementById("codesModal").classList.remove("active");
}

function submitCode(){
  const code=document.getElementById("codeInput").value.trim();
  if(code==="I love fried chicken"){
    infiniteCoins=true;
    coins=999999999;
    document.getElementById("info").textContent="Code accepted: infinite coins";
    beep(980,0.22);
    closeCodes();
    update();
  }else if(code==="el secreto"){
    guaranteedJackpot=true;
    document.getElementById("info").textContent="Code accepted: next spin is a jackpot";
    beep(760,0.16);
    closeCodes();
    update();
  }else{
    document.getElementById("info").textContent="Code not found";
    beep(180,0.12);
  }
}

update();
